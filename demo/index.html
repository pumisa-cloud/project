<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Checklist — Interactive Demo</title>
<style>
/* ===== KKU theme ===== */
:root{
  --kku:#A73B24;--kku-dark:#7D2B19;--kku-soft:#FBEDEA;--kku-tint:#FFF7F4;
  --gold:#D9A441;--gold-soft:#FFF4D6;
  --bg:#FAF8F6;--card:#fff;--border:#EAE3DE;--text:#2E2623;--muted:#7E726C;
  --primary:#A73B24;--primary-soft:#FBEDEA;
  --green:#2E7D52;--green-soft:#E6F4EC;--amber:#B26A00;--amber-soft:#FFF3D6;
  --red:#C0392B;--red-soft:#FCE9E6;--gray-soft:#F3F0ED;
  --radius:14px;--shadow:0 2px 8px rgba(84,45,32,.06),0 10px 24px rgba(84,45,32,.04);
  font-family:'Segoe UI','Noto Sans Thai',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--kku);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:248px;background:linear-gradient(165deg,#7D2B19 0%,#A73B24 58%,#B8472E 100%);
  color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:5px;flex-shrink:0;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.1)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.18)}
.brand-mark{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--kku);display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.16)}
.brand-text b{display:block;font-size:14px;color:#fff}
.brand-text span{display:block;font-size:11px;color:rgba(255,255,255,.78);margin-top:2px}
.sidebar a{color:rgba(255,255,255,.86);padding:10px 12px;border-radius:10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;transition:.16s}
.sidebar a:hover{background:rgba(255,255,255,.13);color:#fff;text-decoration:none;transform:translateX(2px)}
.sidebar a.active{background:#fff;color:var(--kku);font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.navcount{background:var(--gold);color:#4A3200;border-radius:20px;padding:1px 7px;font-size:11px;font-weight:800}
.sidebar-footer{margin-top:auto}
.userbox{font-size:12px;padding:11px 12px;background:rgba(0,0,0,.17);border:1px solid rgba(255,255,255,.14);border-radius:10px}
.userbox select{width:100%;margin-top:7px;padding:7px 8px;border-radius:7px;border:none;background:#fff;color:var(--text)}
.sidebar button{margin-top:8px;width:100%}
.main{flex:1;padding:28px 34px;max-width:1220px;min-width:0}
.page-title{font-size:24px;margin:0 0 4px;font-weight:700;letter-spacing:-.2px}
.page-sub{color:var(--muted);font-size:13px;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat:not(.green):not(.red):not(.amber)::before{content:'📁'}
.stat.green::before{content:'✅'}.stat.red::before{content:'⏰'}.stat.amber::before{content:'📅'}
.stat::before{position:absolute;right:14px;top:13px;font-size:20px;opacity:.4}
.stat .num{font-size:30px;font-weight:800;line-height:1.1}
.stat .label{font-size:12px;color:var(--muted);margin-top:6px}
.stat.red .num{color:var(--red)}.stat.amber .num{color:var(--amber)}.stat.green .num{color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--border)}
td{padding:13px 10px;border-bottom:1px solid var(--border)}tr:last-child td{border-bottom:none}
tr.clickable:hover{background:var(--kku-tint);cursor:pointer}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:.1px}
.badge.gray{background:var(--gray-soft);color:#5F5651}.badge.blue{background:var(--kku-soft);color:var(--kku)}
.badge.green{background:var(--green-soft);color:var(--green)}.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.progress{height:9px;background:var(--gray-soft);border-radius:999px;overflow:hidden;width:150px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--kku),#C85A3D);border-radius:999px}
.progress.big{width:260px;height:12px;flex-shrink:0}
.progress-label{font-size:12px;color:var(--muted);margin-top:5px}
.step{border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;background:var(--card);box-shadow:var(--shadow)}
.step.blocked{opacity:.72}
.step.dirty{border-color:var(--gold);background:#FFFCF5;box-shadow:0 0 0 3px rgba(217,164,65,.16)}
.dirty-note{margin-top:10px;background:var(--gold-soft);color:#7A5200;padding:9px 12px;border-radius:8px;border-left:4px solid var(--gold);font-size:12px;font-weight:600}
.step-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.step-head h3{margin:0 0 4px;font-size:15.5px}
.step-meta{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:7px}
.step-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea,button{font-family:inherit;font-size:14px}
input,select,textarea{padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--kku);box-shadow:0 0 0 3px rgba(167,59,36,.14)}
label.field{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.form-row>div{flex:1;min-width:160px}
.btn{background:var(--kku);color:#fff;border:none;padding:10px 16px;border-radius:9px;cursor:pointer;font-weight:700;
  box-shadow:0 2px 6px rgba(167,59,36,.2);transition:.15s}
.btn:hover{background:var(--kku-dark);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn.secondary{background:var(--kku-soft);color:var(--kku);box-shadow:none}
.btn.secondary:hover{background:#F6DED8}
.btn.small{padding:6px 11px;font-size:12px}
.btn.ghost{background:#fff;border:1px solid var(--border);color:var(--text);box-shadow:none}
.btn.ghost:hover{background:var(--kku-tint);border-color:#E5C9C0}
.layout .sidebar .btn.ghost{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.28);color:#fff;box-shadow:none}
.layout .sidebar .btn.ghost:hover{background:rgba(255,255,255,.18)}
.hint{font-size:12.5px;color:#7A2E1C;background:var(--kku-soft);border-left:4px solid var(--kku);padding:12px 16px;border-radius:10px;margin-bottom:18px}
.notif{display:flex;gap:12px;padding:13px;border-bottom:1px solid var(--border);align-items:flex-start;border-left:3px solid transparent}
.notif.unread{background:var(--kku-tint);border-left-color:var(--kku)}
.notif .dot{width:9px;height:9px;border-radius:50%;background:var(--kku);margin-top:6px;flex-shrink:0}
.notif.read .dot{background:transparent;border:1px solid var(--muted)}
.notif .body{font-size:13px;color:var(--muted);margin-top:4px}
.notif .time{font-size:11px;color:var(--muted);margin-top:5px}
.toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:100}
.toast{background:#3A231D;color:#fff;padding:13px 16px;border-radius:10px;font-size:13px;max-width:330px;
  box-shadow:0 10px 28px rgba(0,0,0,.24);border-left:4px solid var(--gold)}
.toast.err{background:#7D2B19;border-left-color:#fff}
.toast b{display:block;margin-bottom:3px}
.checklist-item{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:7px}
.checklist-item input{width:auto;accent-color:var(--kku)}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.chip{background:var(--gray-soft);border-radius:6px;padding:3px 9px;font-size:11.5px;color:#5F5651}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.page-head h2{margin:0 0 4px;font-size:15px}.crumb{font-size:12px;color:var(--muted);margin:0 0 5px}
.muted{color:var(--muted)}.small{font-size:12px}.danger{color:var(--red);font-weight:700}
.project-progress{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted);background:var(--kku-tint);border:1px solid #F2DED7}
.tabs{display:inline-flex;gap:4px;margin-bottom:16px;background:#fff;padding:4px;border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow)}
.tabs button{background:transparent;border:none;padding:8px 15px;cursor:pointer;color:var(--muted);border-radius:8px;font-weight:600}
.tabs button:hover{background:var(--kku-tint);color:var(--kku)}
.tabs button.active{background:var(--kku);color:#fff}
.blocked-note{margin-top:10px;background:var(--amber-soft);color:#7A5200;padding:9px 12px;border-left:4px solid var(--gold);border-radius:8px;font-size:12px}
.assign-row{align-items:flex-end;background:var(--kku-tint);border:1px solid #F2DED7;border-radius:10px;padding:12px;margin-top:12px;margin-bottom:0}
.subchecklist{margin-top:12px;border-top:1px dashed var(--border);padding-top:11px}
.inline-form{display:flex;gap:8px;margin-top:9px}.inline-form input{flex:1}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:start}
.kanban-col{background:var(--gray-soft);border:1px solid var(--border);border-radius:var(--radius);padding:11px;min-height:120px}
.kanban-col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kanban-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:8px;font-size:13px;box-shadow:0 2px 6px rgba(84,45,32,.05)}
.kanban-move{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.activity-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.task-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 8px;border-bottom:1px solid var(--border);border-radius:8px}
.task-row:hover{background:var(--kku-tint)}
.task-row:last-child{border:none}.step-table{font-size:13px;margin-bottom:12px}.step-table td{padding:7px}
.step-table input:not([type=checkbox]){width:100%}.step-table input[type=checkbox]{width:auto}
.form-actions{margin-top:14px}
@media(max-width:900px){.sidebar{width:210px}.main{padding:20px}}
@media(max-width:640px){.layout{flex-direction:column}.sidebar{width:100%;padding:14px}.sidebar-footer{margin-top:14px}.main{padding:16px}.page-head{flex-direction:column}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">KKU</div>
      <div class="brand-text"><b>Project Checklist</b><span>มหาวิทยาลัยขอนแก่น · HRD</span></div>
    </div>
    <div id="nav"></div>
    <div class="sidebar-footer">
      <div class="userbox"><div>ใช้งานในนาม (จำลอง Login)</div>
        <select id="userSelect" onchange="act.switchUser(this.value)"></select>
      </div>
      <button class="btn ghost small" onclick="act.scan()">⏰ รันสแกนกำหนดเวลา</button>
      <button class="btn ghost small" onclick="act.reset()">↺ รีเซ็ตข้อมูลตัวอย่าง</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toasts" id="toasts"></div>

<script>
/* ===================== utils ===================== */
const KEY='pcdemo-state-v1'
const today=()=>new Date().toISOString().slice(0,10)
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const fmt=(d)=>d?String(d).slice(0,10):'-'
const isOverdue=(s)=>s&&!['Done','Skipped'].includes(s.status)&&(s.due||s.due_date)&&(s.due||s.due_date)<today()
const uid=()=>Math.random().toString(36).slice(2,9)
const money=(n)=>n?Number(n).toLocaleString('th-TH'):'-'

function seed(){
  const users=[
    {id:1,name:'สมชาย (Admin)',role:'Admin',department:'HR',inapp:1,email:1},
    {id:2,name:'มาลี (HR Manager)',role:'Project Manager',department:'HRD',inapp:1,email:1},
    {id:3,name:'ธนา (Training Officer)',role:'Member',department:'HRD',inapp:1,email:1},
    {id:4,name:'จินดา (Line Manager)',role:'Member',department:'Operations',inapp:1,email:1},
    {id:5,name:'ผู้บริหาร (Viewer)',role:'Viewer',department:'Exec',inapp:1,email:0}
  ]
  const t1Steps=[
    ['สำรวจความต้องการฝึกอบรม',7,'HR',1,null],['วิเคราะห์ช่องว่างทักษะ',5,'HR',1,1],
    ['จัดทำแผนพัฒนาบุคลากร',10,'HR Manager',1,2],['ขออนุมัติแผนและงบประมาณ',5,'HR Manager',1,3],
    ['คัดเลือกวิทยากร/ผู้ฝึกสอน',10,'HR',0,4],['ดำเนินการฝึกอบรม',14,'HR',1,5],
    ['ประเมินผลหลังฝึกอบรม',5,'HR Manager',1,6],['สรุปรายงานและข้อเสนอพัฒนา',7,'HR Manager',1,7]
  ]
  const t2Steps=[
    ['เตรียมเอกสารและอุปกรณ์',3,'HR',1,null],['ปฐมนิเทศองค์กร',2,'HR',1,1],
    ['แนะนำทีมและระบบงาน',3,'Line Manager',0,2],['ฝึกทักษะเฉพาะตำแหน่ง',10,'Line Manager',1,3],
    ['ติดตามผล 30 วัน',5,'HR',1,4],['ประเมินและสรุปผลทดลองงาน',3,'HR Manager',1,5]
  ]
  const templates=[
    {id:1,name:'กระบวนการพัฒนาบุคลากรประจำปี',category:'HR Development',description:'ขั้นตอนมาตรฐานตั้งแต่สำรวจความต้องการจนถึงประเมินผลการฝึกอบรม',version:1,
      steps:t1Steps.map((s,i)=>({id:'ts1-'+(i+1),order:i+1,name:s[0],days:s[1],role:s[2],attachment:!!s[3],depends_on_order:s[4]}))},
    {id:2,name:'กระบวนการ Onboarding พนักงานใหม่',category:'Onboarding',description:'ปฐมนิเทศ ติดตามผล และประเมินทดลองงานพนักงานใหม่',version:1,
      steps:t2Steps.map((s,i)=>({id:'ts2-'+(i+1),order:i+1,name:s[0],days:s[1],role:s[2],attachment:!!s[3],depends_on_order:s[4]}))}
  ]
  const projects=[]
  function makeProject({id,code,name,templateId,managerId,start,status,budget,assignees,statuses}){
    const tpl=templates.find(t=>t.id===templateId)
    const steps=tpl.steps.map((ts,i)=>{
      const offset=tpl.steps.slice(0,i).reduce((a,x)=>a+x.days,0)
      const st=statuses[i]||'Not Started'
      const dep=ts.depends_on_order?tpl.steps.find(x=>x.order===ts.depends_on_order):null
      return {id:`${id}-s${i+1}`,order:i+1,name:ts.name,description:'',assignee:assignees[i]||null,
        due:addDays(start,offset+ts.days),status:st,attachment:!!ts.attachment,
        depends_on_id:dep?`${id}-s${dep.order}`:null,completed_at:st==='Done'?today():null,
        checklist:[]}
    })
    projects.push({id,code,name,templateId,managerId,start,status,budget,steps,
      activity:[{id:uid(),at:today(),actor:managerId,action:'สร้างโครงการจากแม่แบบ '+tpl.name}]})
    return projects[projects.length-1]
  }
  const p1=makeProject({id:'p1',code:'HR-2569-001',name:'โครงการพัฒนาทักษะดิจิทัลพนักงาน ปี 2569',templateId:1,managerId:2,
    start:addDays(today(),-40),status:'Active',budget:1800000,
    assignees:[3,3,3,2,3,3,2,2],statuses:['Done','Done','In Progress','Not Started','Not Started','Not Started','Not Started','Not Started']})
  p1.steps[2].due=addDays(today(),-2)
  ;[3,8,14,20,26].forEach((d,i)=>{p1.steps[i+3].due=addDays(today(),d)})
  p1.steps[2].checklist=[{id:'c1',label:'รวมผลสำรวจจากทุกแผนก',done:true},{id:'c2',label:'วิเคราะห์ช่องว่างทักษะ',done:true},{id:'c3',label:'จัดทำร่างแผนเสนอผู้บริหาร',done:false}]
  p1.activity.unshift({id:uid(),at:today(),actor:3,action:'เปลี่ยนสถานะ จัดทำแผนพัฒนาบุคลากร → In Progress'})
  makeProject({id:'p2',code:'HR-2569-002',name:'ปรับปรุงกระบวนการ Onboarding พนักงานใหม่',templateId:2,managerId:2,
    start:addDays(today(),-5),status:'Active',budget:450000,
    assignees:[3,3,4,4,3,2],statuses:['Done','In Progress','Not Started','Not Started','Not Started','Not Started']})
  const notifications=[
    {id:'n1',user:3,type:'Assigned',title:'คุณได้รับมอบหมาย: จัดทำแผนพัฒนาบุคลากร',body:'ขั้นตอน "จัดทำแผนพัฒนาบุคลากร" ในโครงการพัฒนาทักษะดิจิทัลพนักงาน ปี 2569',link:'p1',read:0,channel:'in-app',at:today(),dedupe:''},
    {id:'n2',user:3,type:'Overdue',title:'เลยกำหนด: จัดทำแผนพัฒนาบุคลากร',body:'ขั้นตอน "จัดทำแผนพัฒนาบุคลากร" เลยกำหนดแล้ว',link:'p1',read:0,channel:'in-app',at:today(),dedupe:''},
    {id:'n3',user:2,type:'Status Changed',title:'เตรียมเอกสารและอุปกรณ์ → Done',body:'ขั้นตอน "เตรียมเอกสารและอุปกรณ์" ในโครงการ Onboarding เสร็จสิ้น',link:'p2',read:1,channel:'in-app',at:today(),dedupe:''}
  ]
  return {users,templates,projects,notifications,currentUser:2,route:'dashboard',tab:'checklist'}
}
let S
try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S))
// การแก้ไขจะเก็บเป็น "ร่าง" ก่อน ยังไม่บันทึก/แจ้งเตือนจนกว่าจะกดปุ่ม บันทึก
const drafts={}
const draftOf=(s)=>drafts[s.id]||{assignee:s.assignee,due:s.due||'',status:s.status}
const isDirty=(s)=>{const d=draftOf(s);return d.assignee!==s.assignee||(d.due||'')!==(s.due||'')||d.status!==s.status}
const user=(id)=>S.users.find(u=>u.id===Number(id))
const findStep=(id)=>{for(const p of S.projects){const s=p.steps.find(x=>x.id===id);if(s)return{s,p}}return{}}
const progress=(p)=>p.steps.length?Math.round(p.steps.filter(s=>['Done','Skipped'].includes(s.status)).length/p.steps.length*100):0

function notify({to,type,title,body,link,dedupe}){
  if(!to)return
  const u=user(to);if(!u)return
  if(dedupe&&S.notifications.some(n=>n.dedupe===dedupe))return
  S.notifications.unshift({id:uid(),user:Number(to),type,title,body,link:link||'',read:0,
    channel:u.inapp?'in-app':'email',at:today(),dedupe:dedupe||''})
  if(u.email)console.log(`[EMAIL dry-run] to=${u.email} subject="${title}"`)
}
function toast(title,body,err){
  const el=document.createElement('div');el.className='toast'+(err?' err':'')
  el.innerHTML='<b>'+esc(title)+'</b>'+esc(body||'')
  document.getElementById('toasts').appendChild(el)
  setTimeout(()=>el.remove(),4200)
}
const badge=(s)=>'<span class="badge '+({'Not Started':'gray','In Progress':'blue',Blocked:'amber',Done:'green',Skipped:'gray',Overdue:'red',Active:'blue',Completed:'green',Draft:'gray','On Hold':'amber',Cancelled:'red'}[s]||'gray')+'">'+esc(s)+'</span>'
const bar=(v,big)=>'<div class="progress'+(big?' big':'')+'"><div style="width:'+v+'%"></div></div>'

// บันทึกจริง: ถูกเรียกก็ต่อเมื่อกดปุ่ม "บันทึก" เท่านั้น
function commitStep(id,changes){
  const {s,p}=findStep(id);if(!s)return false
  const labels=[]
  if('status' in changes){
    const v=changes.status
    if(s.depends_on_id){
      const dep=p.steps.find(x=>x.id===s.depends_on_id)
      if(dep&&!['Done','Skipped'].includes(dep.status)){toast('บล็อกโดย dependency','ต้องทำให้ "'+dep.name+'" เสร็จก่อน','err');return false}
    }
    const old=s.status;s.status=v;s.completed_at=v==='Done'?today():null
    p.activity.unshift({id:uid(),at:today(),actor:S.currentUser,action:`เปลี่ยนสถานะ ${s.name} → ${v}`})
    if(old!==v&&p.managerId!==S.currentUser)notify({to:p.managerId,type:'Status Changed',title:s.name+' → '+v,body:`ขั้นตอน "${s.name}" ในโครงการ ${p.name} เปลี่ยนสถานะเป็น ${v}`,link:p.id})
    labels.push('สถานะ → '+v)
    if(p.steps.every(x=>['Done','Skipped'].includes(x.status))&&p.status!=='Completed'){
      p.status='Completed';p.activity.unshift({id:uid(),at:today(),actor:null,action:'ระบบปิดโครงการ: ทุกขั้นตอนเสร็จแล้ว'})
      notify({to:p.managerId,type:'Milestone',title:'โครงการเสร็จสมบูรณ์: '+p.name,body:'ทุกขั้นตอนของโครงการเสร็จสิ้นแล้ว',link:p.id})
      toast('โครงการเสร็จสมบูรณ์','ระบบเปลี่ยนสถานะเป็น Completed อัตโนมัติ')
    }
  }
  if('assignee' in changes){
    const old=s.assignee;s.assignee=changes.assignee
    p.activity.unshift({id:uid(),at:today(),actor:S.currentUser,action:'มอบหมาย '+s.name+' → '+(user(s.assignee)?.name||'ยังไม่กำหนด')})
    if(s.assignee!==old){
      notify({to:s.assignee,type:'Assigned',title:'คุณได้รับมอบหมาย: '+s.name,body:`ขั้นตอน "${s.name}" ในโครงการ ${p.name} กำหนดส่ง ${s.due}`,link:p.id})
      labels.push('ผู้รับผิดชอบ → '+(user(s.assignee)?.name||'ยังไม่กำหนด'))
    }
  }
  if('due' in changes){
    const old=s.due;s.due=changes.due
    p.activity.unshift({id:uid(),at:today(),actor:S.currentUser,action:'ปรับกำหนดส่ง '+s.name+' → '+fmt(s.due)})
    if(s.due!==old){
      if(s.assignee)notify({to:s.assignee,type:'Due Date Changed',title:'ปรับกำหนดส่ง: '+s.name,body:`ขั้นตอน "${s.name}" ในโครงการ ${p.name} กำหนดส่งใหม่เป็น ${fmt(s.due)}`,link:p.id})
      labels.push('กำหนดส่ง → '+fmt(s.due))
    }
  }
  save();delete drafts[id];render()
  if(labels.length)toast('บันทึกการเปลี่ยนแปลงแล้ว',labels.join(' · '))
  return true
}

/* ===================== actions ===================== */
const act={
  go(page,id){S.route=page;S._id=id||null;save();render()},
  switchUser(v){S.currentUser=Number(v);save();render()},
  reset(){if(confirm('รีเซ็ตกลับเป็นข้อมูลตัวอย่าง?' )){localStorage.removeItem(KEY);S=seed();save();render();toast('รีเซ็ตแล้ว','ข้อมูลตัวอย่างกลับมาแล้ว')}},
  scan(){
    let scanned=0,created=0
    for(const p of S.projects){
      for(const s of p.steps){
        if(['Done','Skipped'].includes(s.status)||!s.due)continue
        scanned++
        const diff=Math.round((new Date(s.due+'T00:00:00Z')-new Date(today()+'T00:00:00Z'))/86400000)
        if(diff<0){
          const was=s.status;if(was!=='Overdue'){s.status='Overdue';p.activity.unshift({id:uid(),at:today(),actor:null,action:`ระบบเปลี่ยนสถานะ ${s.name} → Overdue (เลยกำหนด)`})}
          const key=s.id+':overdue:'+today()
          notify({to:s.assignee,type:'Overdue',title:'เลยกำหนด: '+s.name,body:`ขั้นตอน "${s.name}" ในโครงการ ${p.name} เลยกำหนดเมื่อ ${s.due}`,link:p.id,dedupe:key})
          if(p.managerId!==s.assignee)notify({to:p.managerId,type:'Overdue',title:'[PM] เลยกำหนด: '+s.name,body:`ขั้นตอน "${s.name}" ในโครงการ ${p.name} เลยกำหนด`,link:p.id,dedupe:key+':pm'})
          created+=2
        }else if(diff<=1){
          notify({to:s.assignee,type:'Due Soon',title:'ใกล้ถึงกำหนด: '+s.name,body:`ขั้นตอน "${s.name}" ครบกำหนดใน ${diff} วัน (${s.due})`,link:p.id,dedupe:s.id+':soon:'+today()+':'+diff})
          created++
        }
      }
    }
    save();render();toast('สแกนกำหนดเวลาแล้ว',`ตรวจ ${scanned} ขั้นตอน · สร้างการแจ้งเตือน ${created} รายการ`)
  },
  createProject(){
    const name=document.getElementById('cpName').value.trim()
    const tplId=Number(document.getElementById('cpTpl').value)
    const manager=Number(document.getElementById('cpManager').value)||null
    const start=document.getElementById('cpStart').value||today()
    if(!name||!tplId){toast('ข้อมูลไม่ครบ','กรอกชื่อและเลือกแม่แบบ','err');return}
    const tpl=S.templates.find(t=>t.id===tplId)
    const id='p'+uid()
    const steps=tpl.steps.map((ts,i)=>{
      const offset=tpl.steps.slice(0,i).reduce((a,x)=>a+x.days,0)
      const dep=ts.depends_on_order?tpl.steps.find(x=>x.order===ts.depends_on_order):null
      return {id:id+'-s'+(i+1),order:i+1,name:ts.name,description:'',assignee:null,due:addDays(start,offset+ts.days),
        status:'Not Started',attachment:!!ts.attachment,depends_on_id:dep?id+'-s'+dep.order:null,completed_at:null,checklist:[]}
    })
    S.projects.unshift({id,code:'HR-'+(S.projects.length+1).toString().padStart(3,'0'),name,templateId:tplId,managerId:manager,
      start,status:'Active',budget:null,steps,activity:[{id:uid(),at:today(),actor:S.currentUser,action:'สร้างโครงการจากแม่แบบ '+tpl.name}]})
    save();toast('สร้างโครงการแล้ว','ระบบสร้าง '+steps.length+' ขั้นตอนและกำหนดส่งให้อัตโนมัติ')
    act.go('projects',id)
  },
  setProjectStatusDraft(v){drafts.__project__=v;render()},
  saveProjectStatus(){
    const p=S.projects.find(x=>x.id===S._id);if(!p)return
    const v=drafts.__project__
    if(!v||v===p.status){delete drafts.__project__;toast('ไม่มีการเปลี่ยนแปลง','เลือกสถานะใหม่ก่อนบันทึก');return}
    p.status=v;p.activity.unshift({id:uid(),at:today(),actor:S.currentUser,action:'เปลี่ยนสถานะโครงการ → '+v})
    delete drafts.__project__;save();render();toast('บันทึกสถานะโครงการแล้ว',v)
  },
  // เก็บลง "ร่าง" ก่อน — ยังไม่บันทึกและยังไม่แจ้งเตือน
  draftStep(id,key,v){
    const {s}=findStep(id);if(!s)return
    const d={...draftOf(s),[key]:key==='assignee'?(v?Number(v):null):v}
    drafts[id]=d;render()
  },
  saveStep(id){
    const {s}=findStep(id);if(!s)return
    const d=draftOf(s);const changes={}
    if(d.assignee!==s.assignee)changes.assignee=d.assignee
    if((d.due||null)!==(s.due||null))changes.due=d.due||null
    if(d.status!==s.status)changes.status=d.status
    if(!Object.keys(changes).length){toast('ไม่มีการเปลี่ยนแปลง','เลือกค่าใหม่ก่อนกดบันทึก');return}
    commitStep(id,changes)
  },
  // ใช้สำหรับปุ่ม_action โดยตรง เช่น "ทำเสร็จ" ในหน้างานของฉัน / Kanban
  setStepStatus(id,v){return commitStep(id,{status:v})},
  toggleDetail(id){S._open=S._open===id?null:id;save();render()},
  addItem(id){const el=document.getElementById('newItem-'+id);const label=el.value.trim();if(!label)return
    const {s}=findStep(id);s.checklist.push({id:uid(),label,done:false});save();render();toast('เพิ่มรายการย่อยแล้ว',label)},
  toggleItem(stepId,itemId){const {s}=findStep(stepId);const it=s.checklist.find(x=>x.id===itemId);it.done=!it.done;save();render()},
  addTemplate(){
    const name=document.getElementById('tplName').value.trim();if(!name){toast('กรอกชื่อแม่แบบก่อน','','err');return}
    const rows=[...document.querySelectorAll('#tplRows .tplrow')].map((r,i)=>({
      id:'ts'+uid(),order:i+1,name:r.querySelector('.tname').value.trim()||'ขั้นตอน '+(i+1),
      days:Number(r.querySelector('.tdays').value)||1,role:r.querySelector('.trole').value.trim()||null,
      attachment:r.querySelector('.tatt').checked,depends_on_order:Number(r.querySelector('.tdep').value)||null}))
    S.templates.unshift({id:Math.max(...S.templates.map(t=>t.id))+1,name,category:document.getElementById('tplCat').value.trim()||'ทั่วไป',
      description:document.getElementById('tplDesc').value.trim(),version:1,steps:rows})
    save();render();toast('สร้างแม่แบบแล้ว',rows.length+' ขั้นตอน พร้อมนำไปสร้างโครงการ')
  },
  addTplRow(){
    const div=document.createElement('div');div.className='tplrow form-row'
    const i=document.querySelectorAll('#tplRows .tplrow').length+1
    div.innerHTML='<div>'+i+'. <input class="tname" placeholder="ชื่อขั้นตอน"></div>'+
      '<div style="flex:0 0 80px"><input class="tdays" type="number" min="1" value="1"></div>'+
      '<div><input class="trole" placeholder="บทบาท เช่น PM"></div>'+
      '<div style="flex:0 0 90px"><label class="checklist-item"><input class="tatt" type="checkbox" checked> แนบหลักฐาน</label></div>'+
      '<div style="flex:0 0 90px"><input class="tdep" type="number" min="1" placeholder="ขึ้นกับ #"></div>'
    document.getElementById('tplRows').appendChild(div)
  },
  toggleTpl(id){S._tpl=S._tpl===id?null:id;save();render()},
  read(id){const n=S.notifications.find(x=>x.id===id);if(n)n.read=1;save();render()},
  readAll(){S.notifications.forEach(n=>n.read=1);save();render();toast('อ่านทั้งหมดแล้ว','')},
  pref(key,v){const u=user(S.currentUser);u[key]=v?1:0;save();render()}
}

/* ===================== render ===================== */
const NAV=[['dashboard','▦','ภาพรวม'],['projects','▤','โครงการ'],['templates','⚙','แม่แบบกระบวนการ'],['tasks','✓','งานของฉัน'],['notifications','🔔','การแจ้งเตือน']]
function render(){
  const unread=S.notifications.filter(n=>n.user===S.currentUser&&!n.read).length
  document.getElementById('nav').innerHTML=NAV.map(([k,ic,l])=>
    `<a href="#/${k}" class="${S.route===k?'active':''}"><span>${ic} ${l}</span>${k==='notifications'&&unread?'<span class="navcount">'+unread+'</span>':''}</a>`).join('')
  const sel=document.getElementById('userSelect')
  sel.innerHTML=S.users.map(u=>`<option value="${u.id}" ${u.id===S.currentUser?'selected':''}>${esc(u.name)} (${esc(u.role)})</option>`).join('')
  const m=document.getElementById('main')
  if(S.route==='dashboard')m.innerHTML=viewDashboard()
  else if(S.route==='projects')m.innerHTML=S._id?viewProject():viewProjects()
  else if(S.route==='templates')m.innerHTML=viewTemplates()
  else if(S.route==='tasks')m.innerHTML=viewTasks()
  else m.innerHTML=viewNotifications()
  window.scrollTo(0,0)
}
function viewDashboard(){
  const all=S.projects.flatMap(p=>p.steps.map(s=>({...s,p})))
  const overdue=all.filter(isOverdue).length
  const soon=all.filter(s=>!['Done','Skipped'].includes(s.status)&&s.due&&s.due>=today()&&s.due<=addDays(today(),3)).length
  const upcoming=all.filter(s=>!['Done','Skipped'].includes(s.status)&&s.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,10)
  return `<h1 class="page-title">ภาพรวมโครงการ</h1><p class="page-sub">สถานะล่าสุดของทุกโครงการและกำหนดส่งที่ใกล้เข้ามา</p>
  <div class="hint">💡 ลองกด “รันสแกนกำหนดเวลา” ด้านซ้ายเพื่อจำลอง scheduler ทุกวัน 08:00 น. — ข้อมูลจะถูกบันทึกในเบราว์เซอร์ (localStorage)</div>
  <div class="stats">
    <div class="stat"><div class="num">${S.projects.filter(p=>p.status==='Active').length}</div><div class="label">โครงการที่รันอยู่</div></div>
    <div class="stat green"><div class="num">${all.filter(s=>s.status==='Done').length}</div><div class="label">ขั้นตอนเสร็จแล้ว / ${all.length}</div></div>
    <div class="stat red"><div class="num">${overdue}</div><div class="label">เลยกำหนด</div></div>
    <div class="stat amber"><div class="num">${soon}</div><div class="label">ใกล้ถึงกำหนด (3 วัน)</div></div>
  </div>
  <div class="card"><h2>กำหนดส่งที่จะถึงเร็วๆ นี้</h2>
  ${upcoming.length?'<table><thead><tr><th>ขั้นตอน</th><th>โครงการ</th><th>ผู้รับผิดชอบ</th><th>กำหนดส่ง</th><th>สถานะ</th></tr></thead><tbody>'+
  upcoming.map(s=>`<tr class="clickable" onclick="act.go('projects','${s.p.id}')"><td>${esc(s.name)}</td><td>${esc(s.p.name)}</td><td>${esc(user(s.assignee)?.name||'-')}</td><td style="color:${isOverdue(s)?'var(--red)':undefined}">${fmt(s.due)}</td><td>${badge(s.status)}</td></tr>`).join('')+'</tbody></table>':'<div class="empty">ไม่มีงานที่รอดำเนินการ</div>'}
  </div>`
}
function viewProjects(){
  return `<div class="page-head"><div><h1 class="page-title">โครงการ</h1><p class="page-sub">สร้างโครงการจากแม่แบบ กำหนดผู้รับผิดชอบ และติดตามความคืบหน้า</p></div>
  <button class="btn" onclick="this.style.display='none';document.getElementById('cpForm').style.display='block'">+ สร้างโครงการ</button></div>
  <form class="card" id="cpForm" style="display:none" onsubmit="event.preventDefault();act.createProject()">
    <h2>สร้างโครงการใหม่จากแม่แบบ</h2>
    <div class="form-row"><div><label class="field">ชื่อโครงการ</label><input id="cpName" required placeholder="เช่น โครงการพัฒนาภาวะผู้นำ"></div>
    <div><label class="field">รหัสโครงการ</label><input placeholder="ระบบสร้างให้"></div></div>
    <div class="form-row"><div><label class="field">แม่แบบกระบวนการ</label><select id="cpTpl">${S.templates.map(t=>`<option value="${t.id}">${esc(t.name)} (v${t.version})</option>`).join('')}</select></div>
    <div><label class="field">ผู้จัดการโครงการ</label><select id="cpManager">${S.users.filter(u=>['Project Manager','Admin'].includes(u.role)).map(u=>`<option value="${u.id}" ${u.id===2?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div></div>
    <div class="form-row"><div><label class="field">วันเริ่ม</label><input id="cpStart" type="date" value="${today()}"></div></div>
    <button class="btn" type="submit">สร้างโครงการ</button>
  </form>
  <div class="card"><table><thead><tr><th>รหัส</th><th>ชื่อโครงการ</th><th>แม่แบบ</th><th>ผู้จัดการ</th><th>ความคืบหน้า</th><th>สถานะ</th><th>งบประมาณ</th></tr></thead><tbody>
  ${S.projects.map(p=>{const t=S.templates.find(x=>x.id===p.templateId);return `<tr class="clickable" onclick="act.go('projects','${p.id}')"><td>${esc(p.code)}</td><td><b>${esc(p.name)}</b></td><td>${esc(t?.name||'-')}</td><td>${esc(user(p.managerId)?.name||'-')}</td><td>${bar(progress(p))}<div class="progress-label">${progress(p)}%</div></td><td>${badge(p.status)}</td><td>${money(p.budget)}</td></tr>`}).join('')}
  </tbody></table></div>`
}
function viewProject(){
  const p=S.projects.find(x=>x.id===S._id);if(!p)return '<div class="empty">ไม่พบโครงการ <a href="#/projects">กลับ</a></div>'
  const byId=Object.fromEntries(p.steps.map(s=>[s.id,s]))
  const tab=S.tab||'checklist'
  const psDraft=drafts.__project__
  const tabs=`<div class="tabs">${[['checklist','Checklist'],['kanban','Kanban'],['activity','ประวัติการดำเนินงาน']].map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</div>`
  let body=''
  if(tab==='checklist')body=p.steps.map(s=>stepCard(p,s,byId)).join('')
  else if(tab==='kanban')body=`<div class="kanban">${['Not Started','In Progress','Blocked','Done'].map(col=>{
    const list=p.steps.filter(s=>col==='Blocked'?(s.depends_on_id&&!['Done','Skipped'].includes(byId[s.depends_on_id]?.status)):s.status===col)
    return `<div class="kanban-col"><div class="kanban-col-head">${badge(col)}<span class="chip">${list.length}</span></div>${list.map(s=>
      `<div class="kanban-card"><b>${s.order}. ${esc(s.name)}</b><div class="step-meta"><span>👤 ${esc(user(s.assignee)?.name||'ยังไม่กำหนด')}</span><span>📅 ${fmt(s.due)}</span></div>
      <div class="kanban-move">${['Not Started','In Progress','Done'].filter(x=>x!==s.status).map(x=>`<button class="btn ghost small" onclick="act.setStepStatus('${s.id}','${x}')">${x}</button>`).join('')}</div></div>`).join('')}</div>`}).join('')}</div>`
  else body=`<div class="card"><h2>Audit trail</h2>${p.activity.map(a=>`<div class="activity-row"><span class="chip">${fmt(a.at)}</span><b>${esc(user(a.actor)?.name||'ระบบ')}</b> ${esc(a.action)}</div>`).join('')}</div>`
  return `<div class="page-head"><div><p class="crumb"><a href="#/projects">โครงการ</a> / ${esc(p.code)}</p>
    <h1 class="page-title">${esc(p.name)}</h1><p class="page-sub">แม่แบบ: ${esc(S.templates.find(t=>t.id===p.templateId)?.name||'-')} · ผู้จัดการ: ${esc(user(p.managerId)?.name||'-')} · เริ่ม ${fmt(p.start)}</p></div>
    <div><label class="field">สถานะโครงการ</label><div class="step-actions">
      <select onchange="act.setProjectStatusDraft(this.value)">${['Active','On Hold','Completed','Cancelled'].map(s=>`<option ${(psDraft||p.status)===s?'selected':''}>${s}</option>`).join('')}</select>
      <button class="btn small" ${psDraft&&psDraft!==p.status?'':'disabled'} onclick="act.saveProjectStatus()">💾 บันทึก</button></div>
      ${psDraft&&psDraft!==p.status?'<div class="dirty-note">● ยังไม่บันทึกการเปลี่ยนแปลง</div>':''}</div></div>
    <div class="card project-progress">${bar(progress(p),true)}<div><b>${progress(p)}%</b> เสร็จแล้ว (${p.steps.filter(s=>['Done','Skipped'].includes(s.status)).length}/${p.steps.length} ขั้นตอน)</div></div>
    ${tabs}${body}`
}
function stepCard(p,s,byId){
  const dep=s.depends_on_id?byId[s.depends_on_id]:null
  const blocked=dep&&!['Done','Skipped'].includes(dep.status)
  const open=S._open===s.id
  const d=draftOf(s),dirty=isDirty(s)
  return `<div class="step ${blocked?'blocked':''} ${dirty?'dirty':''}"><div class="step-head"><div>
    <h3>${s.order}. ${esc(s.name)} ${badge(s.status)} ${isOverdue(s)&&s.status!=='Overdue'?badge('Overdue'):''}</h3>
    <div class="step-meta"><span>👤 ${esc(user(s.assignee)?.name||'ยังไม่กำหนด')}</span><span>📅 ${fmt(s.due)}</span>
    <span>${s.attachment?'📎 ต้องแนบหลักฐาน':'ไม่บังคับหลักฐาน'}</span>${dep?`<span>🔗 ขึ้นกับ: ${esc(dep.name)}</span>`:''}</div></div>
    <div class="step-actions"><button class="btn ghost small" onclick="act.toggleDetail('${s.id}')">${open?'ซ่อนรายการย่อย':'รายการย่อย'}</button>
    <select ${blocked?'disabled':''} onchange="act.draftStep('${s.id}','status',this.value)">${['Not Started','In Progress','Blocked','Done','Skipped'].map(x=>`<option ${d.status===x?'selected':''}>${x}</option>`).join('')}</select>
    <button class="btn small" ${dirty?'':'disabled'} onclick="act.saveStep('${s.id}')">💾 บันทึก</button></div></div>
    ${dirty?'<div class="dirty-note">● มีการเปลี่ยนแปลงที่ยังไม่บันทึก — กด “💾 บันทึก” เพื่อ record และแจ้งเตือน</div>':''}
    ${blocked?`<div class="blocked-note">⛔ รอขั้นตอนก่อนหน้าให้เสร็จก่อน: <b>${esc(dep.name)}</b></div>`:''}
    <div class="form-row assign-row"><div><label class="field">ผู้รับผิดชอบ</label><select onchange="act.draftStep('${s.id}','assignee',this.value)">
      <option value="">-- ยังไม่กำหนด --</option>${S.users.map(u=>`<option value="${u.id}" ${d.assignee===u.id?'selected':''}>${esc(u.name)} · ${esc(u.role)}</option>`).join('')}</select></div>
    <div><label class="field">กำหนดส่ง</label><input type="date" value="${fmt(d.due)}" onchange="act.draftStep('${s.id}','due',this.value)"></div></div>
    ${open?`<div class="subchecklist"><div class="muted small">รายการย่อยในขั้นตอน</div>
      ${s.checklist.length?s.checklist.map(it=>`<label class="checklist-item"><input type="checkbox" ${it.done?'checked':''} onchange="act.toggleItem('${s.id}','${it.id}')"><span style="text-decoration:${it.done?'line-through':'none'}">${esc(it.label)}</span></label>`).join(''):'<div class="empty">ยังไม่มีรายการย่อย</div>'}
      <div class="inline-form"><input id="newItem-${s.id}" placeholder="เพิ่มรายการย่อย..." onkeydown="if(event.key==='Enter')act.addItem('${s.id}')"><button class="btn small" onclick="act.addItem('${s.id}')">เพิ่ม</button></div></div>`:''}
    </div>`
}
function viewTemplates(){
  return `<div class="page-head"><div><h1 class="page-title">แม่แบบกระบวนการ</h1><p class="page-sub">กำหนดขั้นตอน ระยะเวลา บทบาท หลักฐาน และ dependency</p></div>
  <button class="btn" onclick="document.getElementById('tplForm').style.display=this.style.display==='none'?'block':'none'">+ สร้างแม่แบบ</button></div>
  <form class="card" id="tplForm" style="display:none" onsubmit="event.preventDefault();act.addTemplate()">
    <h2>แม่แบบใหม่</h2><div class="form-row"><div><label class="field">ชื่อแม่แบบ</label><input id="tplName" placeholder="เช่น กระบวนการพัฒนาผู้บริหาร"></div>
    <div><label class="field">ประเภท</label><input id="tplCat" placeholder="HR Development"></div></div>
    <div><label class="field">คำอธิบาย</label><input id="tplDesc"></div><h2 style="margin-top:16px">ขั้นตอน</h2>
    <div id="tplRows"></div><button type="button" class="btn secondary small" onclick="act.addTplRow()">+ เพิ่มขั้นตอน</button>
    <div class="form-actions"><button class="btn" type="submit">บันทึกแม่แบบ</button></div></form>
  ${S.templates.map(t=>`<div class="card"><div class="page-head"><div><h2>${esc(t.name)} <span class="chip">v${t.version}</span> <span class="chip">${esc(t.category)}</span></h2>
    <div class="muted small">${esc(t.description||'')}</div></div><button class="btn ghost small" onclick="act.toggleTpl(${t.id})">${S._tpl===t.id?'ซ่อนขั้นตอน':'ดูขั้นตอน'}</button></div>
    ${S._tpl===t.id?`<table class="step-table"><thead><tr><th>#</th><th>ขั้นตอน</th><th>ระยะเวลา</th><th>บทบาท</th><th>หลักฐาน</th><th>ขึ้นกับ</th></tr></thead><tbody>
    ${t.steps.map(s=>`<tr><td>${s.order}</td><td>${esc(s.name)}</td><td>${s.days} วัน</td><td>${esc(s.role||'-')}</td><td>${s.attachment?'บังคับ':'ไม่บังคับ'}</td><td>${s.depends_on_order?'ขั้นตอนที่ '+s.depends_on_order:'-'}</td></tr>`).join('')}</tbody></table>`:''}</div>`).join('')}`
}
function viewTasks(){
  const tasks=S.projects.flatMap(p=>p.steps.filter(s=>s.assignee===S.currentUser).map(s=>({...s,p})))
  const filter=S._taskFilter||'all'
  const soon=addDays(today(),3)
  const list=tasks.filter(t=>filter==='all'||(filter==='overdue'&&isOverdue(t))||(filter==='soon'&&t.due>=today()&&t.due<=soon&&!['Done','Skipped'].includes(t.status)))
  return `<h1 class="page-title">งานของฉัน</h1><p class="page-sub">งานที่มอบหมายให้ ${esc(user(S.currentUser)?.name)} จากทุกโครงการ</p>
  <div class="tabs">${[['all','ทั้งหมด'],['soon','ใกล้กำหนด 3 วัน'],['overdue','เลยกำหนด']].map(([k,l])=>`<button class="${filter===k?'active':''}" onclick="S._taskFilter='${k}';render()">${l}</button>`).join('')}</div>
  <div class="card">${list.length?list.map(t=>`<div class="task-row"><div><b class="clickable" onclick="act.go('projects','${t.p.id}')">${esc(t.name)}</b>
    <div class="step-meta"><span>📁 ${esc(t.p.name)}</span><span class="${isOverdue(t)?'danger':''}">📅 ${fmt(t.due)}</span></div></div>
    <div class="step-actions">${badge(t.status)}${t.status!=='Done'?`<button class="btn small" onclick="act.setStepStatus('${t.id}','Done')">ทำเสร็จ</button>`:''}</div></div>`).join(''):'<div class="empty">ไม่มีงานในกลุ่มนี้</div>'}</div>`
}
function viewNotifications(){
  const list=S.notifications.filter(n=>n.user===S.currentUser)
  const u=user(S.currentUser)
  return `<div class="page-head"><div><h1 class="page-title">การแจ้งเตือน</h1><p class="page-sub">แจ้งเตือนในแอป + อีเมล (demo แสดงเป็น log ใน console)</p></div>
    <button class="btn secondary" onclick="act.readAll()">อ่านทั้งหมด</button></div>
  <div class="card"><h2>ตั้งค่าการรับการแจ้งเตือนของ ${esc(u.name)}</h2>
    <label class="checklist-item"><input type="checkbox" ${u.inapp?'checked':''} onchange="act.pref('inapp',this.checked)"> แจ้งเตือนในแอป</label>
    <label class="checklist-item"><input type="checkbox" ${u.email?'checked':''} onchange="act.pref('email',this.checked)"> ส่งอีเมล</label></div>
  <div class="card">${list.length?list.map(n=>`<div class="notif ${n.read?'read':'unread'}"><span class="dot"></span><div style="flex:1">
    <div><b>${esc(n.title)}</b> <span class="chip">${esc(n.type)}</span></div>${n.body?`<div class="body">${esc(n.body)}</div>`:''}
    <div class="time">${fmt(n.at)} · ช่องทาง: ${esc(n.channel)}${n.dedupe?' · auto':''}</div></div>
    ${n.read?'':`<button class="btn ghost small" onclick="act.read('${n.id}')">ทำเครื่องหมายอ่าน</button>`}</div>`).join(''):'<div class="empty">ยังไม่มีการแจ้งเตือน</div>'}</div>`
}
window.addEventListener('hashchange',()=>{const p=location.hash.replace(/^#\/?/,'').split('/');S.route=p[0]||'dashboard';S._id=p[1]||null;save();render()})
if(!location.hash)location.hash='#/dashboard'
else{const p=location.hash.replace(/^#\/?/,'').split('/');S.route=p[0]||'dashboard';S._id=p[1]||null}
save();render()
</script>
</body>
</html>
